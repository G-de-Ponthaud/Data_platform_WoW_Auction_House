snapshots:
  - name: flat_auction_snapshot
    relation: ref('sort_cast_data')
    config:
      database: wow_auction_house
      unique_key: auction_id
      strategy: check
      check_cols: ["item_id", "bid", "buyout", "quantity", "time_left", "pet_breed_id", "pet_level", "pet_quality_id","pet_species_id"]
      