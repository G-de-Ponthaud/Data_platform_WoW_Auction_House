        - {auction_id: 3, bid: 4000, item_id: 83800, pet_breed_id: 13, pet_level: 1, pet_quality_id: 3, pet_species_id: 4464, buyout: error, quantity: 1, time_left: MEDIUM, histo_datetime: 2025-01-16 17:22:42-0}
        - {auction_id: 4, bid: null, item_id: 83800, pet_breed_id: error, pet_level: 1, pet_quality_id: 3, pet_species_id: 4464, buyout: 2000, quantity: 1, time_left: SHORT, histo_datetime: 2025-01-16 17:22:42-0}