        rows:
          - {auction_id: 1, bid: 100, item_id: '2200', pet_breed_id: null, pet_level: null, pet_quality_id: null, pet_species_id: null, buyout: 1000, quantity: 1, time_left: LONG, histo_datetime: 2025-01-16 17:22:42-0}
